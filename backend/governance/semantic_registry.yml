# Semantic Registry — SynapseIQ
# Version: 1.0 (v1.3.1)
#
# Canonical metadata for all semantic governance checks.
# Authoritative source for labels, categories, and treatment rules
# used by the pipeline, frontend UI, and future AI agents.
#
# Rule: a check result is an observation, not a decision.
# See docs/semantic_model.md for the full concept glossary.
#
# Loader: backend/connectors/semantic_registry.py

version: "1.0"

checks:

  # ── Check L ────────────────────────────────────────────────────────────────
  ga4_ads_overlap_insufficient:
    label: "Sobreposição GA4–Ads Insuficiente"
    category: "semantic_governance"
    severity_default: "warning"
    source_platform: "ga4+google_ads"
    description: >
      Not enough days of overlap between GA4 events tables and Google Ads data
      to confidently cross-validate conversion attribution.
      The minimum threshold is defined by minimum_overlap_days_for_ads_ga4_validation
      in the tenant measurement config.
    business_impact: >
      Attribution validation between GA4 and Ads cannot be completed. Conversion
      overlap metrics may be inaccurate or based on a partial sample.
    recommended_action: >
      Ensure GA4 data export to BigQuery is active and that sync windows for GA4
      and Ads overlap by at least the configured minimum days. Check BigQuery
      export schedule and Airbyte sync status.
    ui_group: "data_quality"
    evidence_types:
      - "date_coverage"
    can_generate_insight: true
    requires_client_validation: false

  # ── Check M ────────────────────────────────────────────────────────────────
  ga4_conversion_registry_mismatch:
    label: "Eventos de Conversão Não Registrados"
    category: "semantic_governance"
    severity_default: "warning"
    source_platform: "ga4"
    description: >
      Events listed as conversion candidates in the semantic registry
      (canonical_events and intermediate_events in measurement config)
      were not observed in GA4 data for the analysis period.
    business_impact: >
      Conversion tracking gaps are present. The business may be missing
      conversion events in GA4, or the registry contains stale event names
      that no longer fire.
    recommended_action: >
      Verify that canonical conversion events are correctly implemented
      in the GA4 tracking setup. Check for event naming changes in GTM
      or the app. Update the registry if event names have been renamed.
    ui_group: "conversion_quality"
    evidence_types:
      - "missing_canonical_events"
    can_generate_insight: true
    requires_client_validation: true
    requires_client_validation_when_warning: true

  # ── Check N ────────────────────────────────────────────────────────────────
  ads_conversion_action_not_in_registry:
    label: "Ação de Conversão Fora do Registro"
    category: "semantic_governance"
    severity_default: "warning"
    source_platform: "google_ads"
    description: >
      Google Ads conversion actions found in campaign performance data
      do not have a corresponding entry in the semantic conversion registry.
      These actions are being attributed in Ads but have no semantic mapping.
    business_impact: >
      Unregistered conversion actions may inflate or distort ROAS and
      conversion reporting. Actions without registry entries cannot be
      validated against GA4 events, creating an attribution blind spot.
    recommended_action: >
      Add the unregistered conversion action to the tenant measurement config
      under ads_only_conversion_actions or canonical_events. Set
      requires_client_validation: true until the mapping is confirmed.
    ui_group: "conversion_quality"
    evidence_types:
      - "unregistered_ads_actions"
    can_generate_insight: true
    requires_client_validation: true
    requires_client_validation_when_warning: true

  # ── Check O ────────────────────────────────────────────────────────────────
  ads_conversion_action_semantic_review_required:
    label: "Ação de Conversão em Revisão Semântica"
    category: "semantic_governance"
    severity_default: "warning"
    source_platform: "google_ads"
    description: >
      One or more Ads conversion actions are present in the registry with
      status 'semantic_review_required'. These actions are currently being
      used in attribution but have not been validated as the official
      conversion KPI by the client.
    business_impact: >
      Using unvalidated conversion actions as primary KPIs can lead to
      misleading ROAS calculations and incorrect optimization signals
      sent to Google Ads Smart Bidding.
    recommended_action: >
      Review each flagged conversion action with the client. Confirm which
      action represents the canonical business conversion. Update
      business_status to 'validated' in the registry once confirmed.
      Do not use as primary KPI until validated.
    ui_group: "conversion_quality"
    evidence_types:
      - "review_required_actions"
    can_generate_insight: true
    requires_client_validation: true
    requires_client_validation_when_warning: true

  # ── Check P ────────────────────────────────────────────────────────────────
  ga4_non_production_traffic_detected:
    label: "Tráfego Não-Produção Detectado"
    category: "semantic_governance"
    severity_default: "warning"
    source_platform: "ga4"
    description: >
      Paid traffic URLs include sessions originating from non-production
      environments (local, staging, debug, preview). These sessions distort
      paid traffic quality and funnel metrics.
    business_impact: >
      Non-production sessions in paid traffic data inflate session counts,
      distort funnel progression rates, and can incorrectly signal conversion
      events from internal testing.
    recommended_action: >
      Implement GA4 filters or IP exclusions to prevent non-production traffic
      from being recorded in the production GA4 property. Add environment
      exclusion rules in GTM. Verify that internal testing uses a separate
      GA4 property or debug mode that doesn't persist to production tables.
    ui_group: "traffic_quality"
    evidence_types:
      - "environment_breakdown"
    can_generate_insight: false
    requires_client_validation: false

  # ── Check Q ────────────────────────────────────────────────────────────────
  ga4_suspicious_event_names_detected:
    label: "Nomes de Eventos Suspeitos"
    category: "semantic_governance"
    severity_default: "low"
    source_platform: "ga4"
    description: >
      GA4 events with generic or suspicious names detected — typically named
      after platforms, tools, or channels (e.g. "Analytics", "LinkedIn")
      rather than user actions. These names carry no semantic meaning about
      user behavior.
    business_impact: >
      Generic event names make funnel analysis unreliable and prevent
      meaningful semantic classification. They may mask real conversion
      events by polluting event counts.
    recommended_action: >
      Review the suspicious events list in the measurement config and decide
      whether to rename, deprecate, or reclassify each event. Work with the
      tracking team to implement semantically meaningful event names following
      the GA4 naming convention (verb_noun pattern, e.g. form_submit).
    ui_group: "data_quality"
    evidence_types:
      - "suspicious_event_list"
    can_generate_insight: false
    requires_client_validation: false

  # ── Check R ────────────────────────────────────────────────────────────────
  paid_sessions_without_funnel_progress:
    label: "Sessões Pagas sem Avanço no Funil"
    category: "paid_sessions_quality"
    severity_default: "warning"
    source_platform: "ga4"
    description: >
      Paid sessions (identified by gclid presence or utm_source=google) that
      did not trigger any tracked funnel event beyond landing. These sessions
      represent paid traffic that generated no measurable engagement signal.
    business_impact: >
      High percentage of paid sessions without funnel progress indicates
      landing page-level friction, audience mismatch, or tracking gaps in
      intermediate funnel events. Directly impacts attribution quality and
      Smart Bidding signal reliability.
    recommended_action: >
      Investigate landing pages with the highest paid session drop-off.
      Verify intermediate funnel events (engagement, intent) are correctly
      tracked. Consider adding micro-conversion events at key engagement
      points (scroll depth, video play, form interaction).
    ui_group: "funnel_quality"
    evidence_types:
      - "session_funnel_breakdown"
    can_generate_insight: true
    requires_client_validation: false

  # ── Check S ────────────────────────────────────────────────────────────────
  utm_campaign_empty_in_paid_urls:
    label: "UTM Campaign Ausente em URLs Pagas"
    category: "paid_sessions_quality"
    severity_default: "warning"
    source_platform: "ga4"
    description: >
      Paid landing page URLs (with gclid or utm_source=google) are missing
      the utm_campaign parameter. All required paid URL attribution parameters
      are verified; utm_campaign is the most critical missing field.
    business_impact: >
      Missing utm_campaign breaks campaign-level attribution in GA4 and
      prevents accurate ROAS calculation per campaign in reporting tools.
      Sessions appear as unattributed or lumped under a generic campaign.
    recommended_action: >
      Audit Google Ads final URL templates and ensure utm_campaign is
      included in all ad destination URLs. Use ValueTrack parameters
      ({campaign}) to populate utm_campaign automatically. Verify in
      Google Ads URL Templates at account and campaign level.
    ui_group: "attribution_quality"
    evidence_types:
      - "missing_params_by_url"
    can_generate_insight: true
    requires_client_validation: false
