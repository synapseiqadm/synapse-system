name: Sync BigQuery → Supabase (Cacau Turismo)

on:
  schedule:
    - cron: "0 10 * * *"  # 07:00 BRT — 1h after Woke, 30min after Pigz
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate pipeline without writing to Supabase"
        type: boolean
        default: true

concurrency:
  group: a-data-sync-cacau
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Run a_data_sync.py (Cacau Turismo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Write Google service account credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDS_B64" | base64 --decode > /tmp/gcp_credentials.json

      - name: Run data sync (Cacau Turismo)
        env:
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:           ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
          PYTHONIOENCODING:               "utf-8"
          APP_ENV:                        "production"
          ALLOW_MOCK_DATA:                "false"
          WORKSPACE_ID:                   "b7126974-4b12-468a-bea6-7852fae62a00"
          GCP_PROJECT_ID:                 "synapsesystem"
          BQ_LOCATION:                    "southamerica-east1"
          GOOGLE_ADS_CUSTOMER_ID:         "7184417498"
          GOOGLE_ADS_DATASET:             "raw_google_ads_cacau"
          GA4_DATASET:                    ""
          DATE_RANGE_DAYS:                "30"
          ENABLE_INSIGHTS:                "true"
          MEASUREMENT_CONFIG_PATH:        "governance/tenants/cacau_measurement_config.yml"
        run: |
          cd backend
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m connectors.a_data_sync --dry-run
          else
            python -m connectors.a_data_sync
          fi

      - name: Remove credentials file
        if: always()
        run: rm -f /tmp/gcp_credentials.json
