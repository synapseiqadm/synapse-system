name: Sync BigQuery → Supabase

on:
  schedule:
    # 06:00 AM Brasília (UTC-3) = 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # permite trigger manual pelo GitHub UI

jobs:
  sync:
    name: Run a_data_sync.py
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # ── 3. Google credentials ─────────────────────────────────────────────
      # Store the full contents of credentials.json as secret GOOGLE_CREDENTIALS_JSON
      - name: Write Google service account credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > /tmp/gcp_credentials.json

      # ── 4. Run sync ───────────────────────────────────────────────────────
      - name: Sync campaigns and keywords
        env:
          SUPABASE_URL:                  ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
          PYTHONIOENCODING: "utf-8"
          APP_ENV: "production"
          ALLOW_MOCK_DATA: "false"
          WOKE_WORKSPACE_ID: "a082fe86-a65f-4c9b-9442-fe775f47e3fc"
          GCP_PROJECT_ID: "synapsesystem"
          BQ_LOCATION: "southamerica-east1"
          GOOGLE_ADS_DATASET: "raw_google_ads_woke"
          GOOGLE_ADS_CUSTOMER_ID: "6627867790"
          GA4_DATASET: ""
          DATE_RANGE_DAYS: "30"
        run: |
          cd backend
          python -m connectors.a_data_sync

      # ── 5. Cleanup ────────────────────────────────────────────────────────
      - name: Remove credentials file
        if: always()
        run: rm -f /tmp/gcp_credentials.json
