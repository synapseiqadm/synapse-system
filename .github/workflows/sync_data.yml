name: Sync BigQuery → Supabase

on:
  schedule:
    - cron: "0 9 * * *"  # 06:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate pipeline without writing to Supabase"
        type: boolean
        default: true

# Prevent overlapping runs. A new trigger waits for the in-progress run to finish
# rather than cancelling it (cancel-in-progress: false) to avoid partial writes.
concurrency:
  group: a-data-sync-woke
  cancel-in-progress: false

# Use Node.js 24 for all JavaScript actions (checkout, setup-python).
# Silences the Node.js 20 deprecation warning; required before June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Run a_data_sync.py
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # ── 3. Google credentials ─────────────────────────────────────────────
      # Secret GOOGLE_CREDENTIALS_JSON must contain the base64-encoded credentials.json.
      # Generate with: [Convert]::ToBase64String([IO.File]::ReadAllBytes("credentials.json"))
      # Base64 avoids JSON special-character issues when storing the secret.
      - name: Write Google service account credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDS_B64" | base64 --decode > /tmp/gcp_credentials.json

      # ── 4. Run sync ───────────────────────────────────────────────────────
      - name: Run data sync
        env:
          SUPABASE_URL:                   ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:           ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_credentials.json
          PYTHONIOENCODING:               "utf-8"
          APP_ENV:                        "production"
          ALLOW_MOCK_DATA:                "false"
          WORKSPACE_ID:                   "a082fe86-a65f-4c9b-9442-fe775f47e3fc"
          GCP_PROJECT_ID:                 "synapsesystem"
          BQ_LOCATION:                    "southamerica-east1"
          GOOGLE_ADS_DATASET:             "raw_google_ads_woke"
          GOOGLE_ADS_CUSTOMER_ID:         "6627867790"
          GA4_DATASET:                    ""
          DATE_RANGE_DAYS:                "30"
          ENABLE_INSIGHTS:                "true"
        run: |
          cd backend
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m connectors.a_data_sync --dry-run
          else
            python -m connectors.a_data_sync
          fi

      # ── 5. Cleanup ────────────────────────────────────────────────────────
      # Runs even on failure to ensure credentials are never left on the runner.
      - name: Remove credentials file
        if: always()
        run: rm -f /tmp/gcp_credentials.json
